{% extends "base.html" %}

{% block content %}
<div class="flex-1 flex flex-col">
    <!-- Map Header -->
    <div class="tactical-panel m-4 p-4 flex items-center justify-between">
        <h2 class="text-2xl font-mono text-gray-200 uppercase tracking-widest">Tactical Overview Map</h2>
        <div class="font-mono text-sm text-neon-green">
            🎯 LIVE TRACKING ACTIVE
        </div>
    </div>

    <!-- Map Container -->
    <div id="map-container" class="flex-1 m-4 tactical-panel overflow-hidden">
        <div id="map" style="height: 100%; width: 100%;"></div>
    </div>

    <!-- Status Legend -->
    <div class="tactical-panel m-4 p-4">
        <div class="flex justify-center space-x-6 font-mono text-sm">
            <div class="flex items-center space-x-2">
                <div class="w-4 h-4 bg-neon-red rounded-full animate-pulse"></div>
                <span class="text-neon-red">CRITICAL</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-4 h-4 bg-neon-yellow rounded-full"></div>
                <span class="text-neon-yellow">WARNING</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-4 h-4 bg-neon-green rounded-full"></div>
                <span class="text-neon-green">STABLE</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- Leaflet.js CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>

<!-- Leaflet.js JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
let map = null;
let markers = {};
let initialBoundsSet = false;
let safeZoneCircle = null;

// Calculate distance in meters
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3; // metres
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Initialize map
async function initializeMap() {
    try {
        // Check if Leaflet is loaded
        if (typeof L === 'undefined') {
            console.log('Leaflet.js not found, loading dynamically...');
            // Try to load Leaflet dynamically as fallback
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
                script.crossOrigin = '';
                script.onload = () => {
                    console.log('Leaflet.js loaded dynamically');
                    resolve();
                };
                script.onerror = (error) => {
                    console.error('Failed to load Leaflet.js:', error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        } else {
            console.log('Leaflet.js already loaded');
        }

        console.log('Initializing map...');
        map = L.map('map').setView([29.3750, 79.5314], 15);
        console.log('Map created');

        // Add standard OpenStreetMap tiles for better visibility
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        console.log('Tile layer added');

        // Add error event listener for tile loading
        tileLayer.on('tileerror', function(e) {
            console.error('Tile loading error:', e);
            // Fallback to CartoDB if OSM fails
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© CartoDB'
            }).addTo(map);
        });

        // Force map to recalculate its size after initialization
        setTimeout(() => { map.invalidateSize(); }, 200);

        console.log('Map initialized successfully');
    } catch (error) {
        console.error('Failed to initialize map:', error);
        document.getElementById('map-container').innerHTML = '<div class="p-8 text-center text-gray-400"><div class="text-neon-red text-4xl mb-4">❌</div><div class="font-mono mb-2">MAP INITIALIZATION FAILED</div><div class="text-sm mb-2">Error: ' + error.message + '</div><div class="text-sm">Please check your internet connection and refresh the page.</div></div>';
    }
}

function createCustomMarker(soldier) {
    const isCaptain = soldier.role === 'CAPTAIN';
    const statusColor = isCaptain ? '#eab308' : (soldier.triage === 'RED' ? '#ff2a2a' :
                      soldier.triage === 'YELLOW' ? '#ffea00' : '#39ff14');

    const markerHtml = `
        <div class="custom-marker" style="
            width: ${isCaptain ? '36px' : '30px'};
            height: ${isCaptain ? '36px' : '30px'};
            background: ${isCaptain ? '#222' : statusColor};
            border: 2px solid ${isCaptain ? '#eab308' : '#fff'};
            border-radius: ${isCaptain ? '20%' : '50%'};
            box-shadow: 0 0 ${isCaptain ? '15px' : '10px'} ${statusColor};
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: ${isCaptain ? '#eab308' : '#000'};
            font-size: ${isCaptain ? '16px' : '12px'};
            ${soldier.triage === 'RED' && !isCaptain ? 'animation: pulse 2s infinite;' : ''}
        ">
            ${isCaptain ? '⭐' : soldier.id.split('-')[0].charAt(0)}
        </div>
    `;

    return L.divIcon({
        html: markerHtml,
        className: 'custom-marker-container',
        iconSize: [36, 36],
        iconAnchor: [18, 18]
    });
}

// Update map with soldier data
function updateMap(soldiers) {
    console.log('updateMap called with', soldiers.length, 'soldiers');
    if (!map) {
        console.error('Map not initialized');
        return;
    }

    // First pass to find Captain for Safe Zone
    let captainLat = null, captainLng = null;
    soldiers.forEach(soldier => {
        if (soldier.role === 'CAPTAIN') {
            captainLat = soldier.latitude || 29.3750;
            captainLng = soldier.longitude || 79.5314;
        }
    });

    // Update or create safe zone
    if (captainLat && !safeZoneCircle) {
        safeZoneCircle = L.circle([captainLat, captainLng], {
            color: '#39ff14',
            fillColor: '#39ff14',
            fillOpacity: 0.05,
            radius: 500, // 500m safe zone
            dashArray: '10, 10'
        }).addTo(map);
    } else if (captainLat && safeZoneCircle) {
        safeZoneCircle.setLatLng([captainLat, captainLng]);
    }

    soldiers.forEach(soldier => {
        const lat = soldier.latitude || 29.3750;
        const lng = soldier.longitude || 79.5314;

        // Validate coordinates
        if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
            console.warn(`Invalid coordinates for soldier ${soldier.id}: ${lat}, ${lng}`);
            return;
        }
        
        // Calculate Distance
        let distHtml = '';
        if (captainLat && soldier.role !== 'CAPTAIN') {
            const dist = getDistance(captainLat, captainLng, lat, lng).toFixed(0);
            const isOOB = dist > 500;
            distHtml = `<br>Dist to Capt: <span style="color: ${isOOB ? '#ff2a2a' : '#aaa'}; font-weight: ${isOOB ? 'bold' : 'normal'}">${dist}m ${isOOB ? '(OOB)' : ''}</span>`;
        }

        if (markers[soldier.id]) {
            // Update existing marker
            markers[soldier.id].setLatLng([lat, lng]);
            markers[soldier.id].setIcon(createCustomMarker(soldier));
        } else {
            // Create new marker
            markers[soldier.id] = L.marker([lat, lng], {
                icon: createCustomMarker(soldier)
            }).addTo(map);
        }
        
        // Update popup content
        markers[soldier.id].bindPopup(`
            <div class="font-mono text-sm" style="color: #222;">
                <strong>${soldier.role === 'CAPTAIN' ? '⭐ ' : ''}${soldier.id}</strong><br>
                Status: <span style="color: ${soldier.triage === 'RED' ? '#ff2a2a' : soldier.triage === 'YELLOW' ? '#eab308' : '#22c55e'}">${soldier.triage}</span><br>
                Vitals: ${soldier.hr} BPM | ${soldier.spo2}% SpO2<br>
                Tech: ${soldier.battery || 100}% Batt | ${soldier.signal || 100}% Sig
                ${distHtml}
            </div>
        `);
    });

    // Clean up markers for soldiers that no longer exist
    Object.keys(markers).forEach(soldierId => {
        if (!soldiers.some(s => s.id === soldierId)) {
            map.removeLayer(markers[soldierId]);
            delete markers[soldierId];
        }
    });

    // Auto-center map ONLY on first load — don't override user zoom/pan
    if (!initialBoundsSet && soldiers.length > 0) {
        const bounds = Object.values(markers).map(marker => marker.getLatLng());
        if (bounds.length > 1) {
            map.fitBounds(bounds, { padding: [50, 50] });
        } else if (bounds.length === 1) {
            map.setView(bounds[0], 15);
        }
        initialBoundsSet = true;
    }
}

// Listen for real-time updates
document.addEventListener('soldierDataUpdate', (event) => {
    console.log('Received soldierDataUpdate event:', event.detail.length, 'soldiers');
    updateMap(event.detail);
});

// Initial data load
async function loadInitialMapData() {
    try {
        await initializeMap();

        let retries = 3;
        let response;

        while (retries > 0) {
            try {
                response = await fetch('/api/soldiers/');
                if (response.ok) {
                    const data = await response.json();
                    updateMap(data.soldiers);
                    return;
                }
                throw new Error(`HTTP ${response.status}`);
            } catch (error) {
                retries--;
                if (retries === 0) {
                    throw error;
                }
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second before retry
            }
        }
    } catch (error) {
        console.error('Error loading map data:', error);

        // Show error message on map container
        const mapContainer = document.getElementById('map-container');
        if (mapContainer && !mapContainer.querySelector('.text-center')) {
            mapContainer.innerHTML = '<div class="p-8 text-center text-gray-400"><div class="text-neon-yellow text-4xl mb-4">⚠️</div><div class="font-mono mb-2">MAP DATA UNAVAILABLE</div><div class="text-sm mb-2">Error: ' + error.message + '</div><div class="text-sm">Unable to load soldier data. Please check backend connection.</div></div>';
        }
    }
}

document.addEventListener('DOMContentLoaded', loadInitialMapData);
</script>

<style>
#map-container {
    min-height: 75vh;
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
    z-index: 1;
}

/* Ensure map tiles are visible */
.leaflet-container {
    background: #0a0e11;
}

/* Custom marker styles */
.custom-marker-container {
    background: transparent !important;
    border: none !important;
}

.custom-marker-container {
    background: transparent !important;
    border: none !important;
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 0 5px #ff2a2a, 0 0 5px #ff2a2a;
    }
    50% {
        box-shadow: 0 0 20px #ff2a2a, 0 0 10px #ff2a2a;
    }
}
</style>
{% endblock %}
