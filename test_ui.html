<!DOCTYPE html>
<html>
<head>
    <title>UI Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'obsidian': '#0a0e11',
              'charcoal': '#121a21',
              'steel': '#2C3E50',
              'neon-red': '#ff2a2a',
              'neon-yellow': '#ffea00',
              'neon-green': '#39ff14',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Roboto Mono', 'monospace'],
            }
          }
        }
      }

      tailwind.css = `
        @import "tailwindcss";

        @theme {
          --color-obsidian: #0a0e11;
          --color-charcoal: #121a21;
          --color-steel: #2C3E50;
          --color-neon-red: #ff2a2a;
          --color-neon-yellow: #ffea00;
          --color-neon-green: #39ff14;

          --font-sans: Inter, sans-serif;
          --font-mono: Roboto Mono, monospace;
        }

        body {
          background: var(--color-obsidian);
          color: rgb(229 231 235);
          font-family: var(--font-sans);
        }

        .tactical-panel {
          background: var(--color-charcoal);
          border: 1px solid color-mix(in oklab, var(--color-steel) 50%, transparent);
          border-radius: 0.375rem;
          padding: 1rem;
          margin: 1rem;
        }
      `;
    </script>
</head>
<body>
    <h1 class="text-2xl text-white p-4">UI Test</h1>
    <div class="tactical-panel">
        This is a tactical panel
    </div>
    <div class="bg-neon-red text-black p-2 m-2">
        Neon red background
    </div>
    <div class="bg-neon-green text-black p-2 m-2">
        Neon green background
    </div>
</body>
</html>
